name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --continue --no-daemon --console=plain 2>&1 | tee build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interview-prep-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish build output to the build-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} $(git rev-parse HEAD)" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -q -m "Build output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-output
